<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SOY CHÓLOPE - Perú: Modo Supervivencia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:ital,wght@0,700;0,900;1,900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #e62329;
            --accent-yellow: #f5c400;
            --bg-dark: #0f1015;
            --card-bg: rgba(20, 22, 30, 0.85);
            --border-glow: #e62329;
            --text-light: #ffffff;
            --text-muted: #a3a8b8;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-dark);
            font-family: 'Rubik', sans-serif;
            color: var(--text-light);
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        canvas#gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            background-color: #111;
        }

        /* Top HUD */
        .hud-overlay {
            position: absolute;
            top: 16px;
            left: 16px;
            right: 16px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
            z-index: 10;
        }

        .hud-left {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .title-badge {
            background: linear-gradient(135deg, #111 0%, #1e2029 100%);
            border: 2px solid var(--primary);
            padding: 6px 14px;
            border-radius: 6px;
            box-shadow: 0 4px 15px rgba(230, 35, 41, 0.35);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .title-badge h1 {
            font-size: 16px;
            font-weight: 900;
            color: #fff;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .title-badge .tag {
            color: var(--accent-yellow);
            font-size: 11px;
            font-weight: 900;
            background: #2b0003;
            border: 1px solid var(--accent-yellow);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .life-bar {
            display: flex;
            gap: 6px;
            align-items: center;
            background: rgba(0, 0, 0, 0.7);
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid #333;
            width: fit-content;
        }

        .life-heart {
            width: 22px;
            height: 22px;
            filter: drop-shadow(0 0 4px rgba(255, 30, 40, 0.8));
            animation: pulseHeart 1.8s infinite ease-in-out;
        }

        @keyframes pulseHeart {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .hud-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
        }

        .distance-card {
            background: #000;
            border: 2px solid #fff;
            border-radius: 6px;
            padding: 8px 14px;
            font-family: 'Press Start 2P', monospace;
            text-align: right;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.8);
        }

        .distance-label {
            font-size: 8px;
            color: #aaa;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .distance-value {
            font-size: 16px;
            color: var(--accent-yellow);
            text-shadow: 2px 2px 0px #000;
        }

        .location-sign {
            background: #14532d;
            border: 2px solid #fff;
            border-radius: 4px;
            padding: 4px 10px;
            font-size: 10px;
            font-weight: 900;
            color: #fff;
            text-align: center;
            box-shadow: 3px 3px 0 #000;
            letter-spacing: 0.5px;
        }

        /* Controls Bottom HUD */
        .controls-overlay {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 0 24px;
            pointer-events: none;
            z-index: 10;
        }

        .desktop-guide {
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid #444;
            backdrop-filter: blur(8px);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 16px;
            color: #ddd;
        }

        .desktop-guide kbd {
            background: #252836;
            border: 1px solid #555;
            border-bottom: 2px solid #222;
            padding: 2px 8px;
            border-radius: 4px;
            font-family: 'Press Start 2P', monospace;
            font-size: 9px;
            color: #fff;
        }

        /* Mobile Touch Controls */
        .touch-controls {
            display: none;
            width: 100%;
            justify-content: space-between;
            pointer-events: auto;
        }

        @media (max-width: 900px), (pointer: coarse) {
            .touch-controls {
                display: flex;
            }
            .desktop-guide {
                display: none;
            }
        }

        .touch-group {
            display: flex;
            gap: 12px;
        }

        .touch-btn {
            width: 60px;
            height: 60px;
            background: rgba(20, 22, 30, 0.85);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 12px;
            color: #fff;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.6);
            transition: transform 0.08s, background-color 0.08s, border-color 0.08s;
        }

        .touch-btn:active, .touch-btn.active {
            transform: scale(0.92);
            background: var(--primary);
            border-color: #fff;
        }

        .touch-btn.jump-btn {
            background: rgba(230, 35, 41, 0.8);
            border-color: var(--accent-yellow);
        }

        /* Loading Indicator */
        #loading-screen {
            position: absolute;
            inset: 0;
            background: #0b0c10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            z-index: 100;
            transition: opacity 0.4s ease;
        }

        #loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #222;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-family: 'Press Start 2P', monospace;
            font-size: 11px;
            color: var(--accent-yellow);
            text-align: center;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <!-- Pantalla de carga -->
        <div id="loading-screen">
            <div class="spinner"></div>
            <div class="loading-text">
                CARGANDO LIMA 2D...<br>
                <span style="font-size:9px;color:#aaa;">SOY CHÓLOPE: MODO SUPERVIVENCIA</span>
            </div>
        </div>

        <!-- Canvas principal -->
        <canvas id="gameCanvas"></canvas>

        <!-- HUD superior estilo referencia -->
        <div class="hud-overlay">
            <div class="hud-left">
                <div class="title-badge">
                    <h1>SOYCHÓLOPE*</h1>
                    <span class="tag">MODO CAUSA</span>
                </div>
                <div class="life-bar">
                    <!-- 3 corazones -->
                    <svg class="life-heart" viewBox="0 0 24 24" fill="#e62329">
                        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                    </svg>
                    <svg class="life-heart" viewBox="0 0 24 24" fill="#e62329">
                        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                    </svg>
                    <svg class="life-heart" viewBox="0 0 24 24" fill="#e62329">
                        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                    </svg>
                </div>
            </div>

            <div class="hud-right">
                <div class="distance-card">
                    <div class="distance-label">DISTANCIA:</div>
                    <div class="distance-value" id="distDisplay">00000 m</div>
                </div>
                <div class="location-sign">
                    📍 AV. ABANCAY ➔ VÍA EXPRESA
                </div>
            </div>
        </div>

        <!-- Controles / Guía -->
        <div class="controls-overlay">
            <div class="desktop-guide">
                <div><kbd>◀</kbd> <kbd>▶</kbd> o <kbd>A</kbd> <kbd>D</kbd> Moverse Adelante / Atrás</div>
                <div><kbd>ESPACIO</kbd> o <kbd>▲</kbd> Saltar</div>
                <div style="color:var(--accent-yellow);">🏃 Mantén presionado para acelerar</div>
            </div>

            <div class="touch-controls">
                <div class="touch-group">
                    <div class="touch-btn" id="btnLeft">◀</div>
                    <div class="touch-btn" id="btnRight">▶</div>
                </div>
                <div class="touch-group">
                    <div class="touch-btn jump-btn" id="btnJump">⬆</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // SOY CHÓLOPE - MOTOR DE PARALLAX & JUEGO 2D
        // ==========================================

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        const distDisplay = document.getElementById('distDisplay');
        const loadingScreen = document.getElementById('loadingScreen');

        // Configuración de resolución virtual (estilo pixel art retro 16:9)
        const V_WIDTH = 960;
        const V_HEIGHT = 540;

        // Assets
        const assets = {
            sky: new Image(),
            foreground: new Image(),
            character: new Image()
        };

        assets.sky.src = './fondo-cielo.png';
        assets.foreground.src = './primer-plano.png';
        assets.character.src = './personaje-base.png';

        let assetsLoaded = 0;
        const totalAssets = 3;

        // Bounding box calculado del personaje para recortar espacios transparentes
        let charCrop = { x: 0, y: 0, w: 100, h: 100 };

        function onAssetLoaded() {
            assetsLoaded++;
            if (assetsLoaded === totalAssets) {
                calculateCharCrop();
                document.getElementById('loading-screen').classList.add('hidden');
                initGame();
            }
        }

        assets.sky.onload = onAssetLoaded;
        assets.foreground.onload = onAssetLoaded;
        assets.character.onload = onAssetLoaded;

        // Calcula el recorte ajustado del personaje eliminando márgenes transparentes
        function calculateCharCrop() {
            const im = assets.character;
            const w = im.naturalWidth || im.width;
            const h = im.naturalHeight || im.height;
            const temp = document.createElement('canvas');
            temp.width = w;
            temp.height = h;
            const tctx = temp.getContext('2d');
            tctx.drawImage(im, 0, 0);
            
            try {
                const imgData = tctx.getImageData(0, 0, w, h);
                const data = imgData.data;
                let minX = w, minY = h, maxX = 0, maxY = 0;
                let found = false;

                for (let y = 0; y < h; y += 2) {
                    for (let x = 0; x < w; x += 2) {
                        const alpha = data[(y * w + x) * 4 + 3];
                        if (alpha > 20) {
                            if (x < minX) minX = x;
                            if (x > maxX) maxX = x;
                            if (y < minY) minY = y;
                            if (y > maxY) maxY = y;
                            found = true;
                        }
                    }
                }

                if (found && maxX > minX && maxY > minY) {
                    // Margen pequeño de 2px
                    charCrop = {
                        x: Math.max(0, minX - 2),
                        y: Math.max(0, minY - 2),
                        w: Math.min(w, (maxX - minX) + 4),
                        h: Math.min(h, (maxY - minY) + 4)
                    };
                } else {
                    charCrop = { x: 0, y: 0, w: w, h: h };
                }
            } catch (e) {
                charCrop = { x: 0, y: 0, w: w, h: h };
            }
        }

        // ==========================================
        // ESTADO DEL JUGADOR Y DE LA CÁMARA
        // ==========================================
        const player = {
            // Posición en el mundo
            x: 200,
            y: 0,
            groundY: 0, // calculado en base a la pista
            vx: 0,
            vy: 0,
            speed: 5.5,
            jumpStrength: -13.5,
            gravity: 0.65,
            isGrounded: true,
            facingRight: true,
            width: 110,
            height: 110,
            // Animación
            runCycle: 0,
            bobbing: 0,
            isMoving: false,
            // Partículas
            particles: []
        };

        // Scroll global del mundo (avanza infinitamente)
        let worldScrollX = 0;
        let distanceMeters = 0;

        // Entradas
        const keys = {
            left: false,
            right: false,
            jump: false
        };

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            ctx.imageSmoothingEnabled = false; // Look pixel art nítido
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Control de teclado
        window.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
            if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
                if (!keys.jump && player.isGrounded) {
                    player.vy = player.jumpStrength;
                    player.isGrounded = false;
                    createDustParticles(player.x + player.width / 2, player.groundY + player.height - 4, 8);
                }
                keys.jump = true;
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
            if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') keys.jump = false;
        });

        // Controles táctiles
        function setupTouchBtn(btnId, keyName, isJump = false) {
            const el = document.getElementById(btnId);
            if (!el) return;

            const startAction = (e) => {
                e.preventDefault();
                el.classList.add('active');
                if (isJump) {
                    if (player.isGrounded) {
                        player.vy = player.jumpStrength;
                        player.isGrounded = false;
                        createDustParticles(player.x + player.width / 2, player.groundY + player.height - 4, 8);
                    }
                } else {
                    keys[keyName] = true;
                }
            };

            const endAction = (e) => {
                e.preventDefault();
                el.classList.remove('active');
                if (!isJump) keys[keyName] = false;
            };

            el.addEventListener('touchstart', startAction, { passive: false });
            el.addEventListener('touchend', endAction, { passive: false });
            el.addEventListener('mousedown', startAction);
            el.addEventListener('mouseup', endAction);
            el.addEventListener('mouseleave', endAction);
        }

        setupTouchBtn('btnLeft', 'left');
        setupTouchBtn('btnRight', 'right');
        setupTouchBtn('btnJump', 'jump', true);

        // Generador de partículas de polvo al correr/saltar
        function createDustParticles(x, y, count = 3) {
            for (let i = 0; i < count; i++) {
                player.particles.push({
                    x: x + (Math.random() * 20 - 10),
                    y: y + (Math.random() * 6 - 3),
                    vx: (Math.random() * 2 - 1) - (player.facingRight ? 1.5 : -1.5),
                    vy: -(Math.random() * 1.5 + 0.5),
                    size: Math.random() * 4 + 2,
                    alpha: 0.8,
                    color: Math.random() > 0.5 ? '#d2b48c' : '#888'
                });
            }
        }

        function initGame() {
            lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        }

        // ==========================================
        // BUCLE PRINCIPAL (60 FPS)
        // ==========================================
        let lastTime = 0;

        function update(dt) {
            // Movimiento horizontal
            player.isMoving = false;

            if (keys.right) {
                player.vx = player.speed;
                player.facingRight = true;
                player.isMoving = true;
            } else if (keys.left) {
                player.vx = -player.speed;
                player.facingRight = false;
                player.isMoving = true;
            } else {
                player.vx = 0;
            }

            // Desplazamiento del personaje en pantalla y scroll del mundo
            const screenCenterX = V_WIDTH * 0.45;
            
            // Si el jugador se mueve hacia la derecha
            if (player.vx > 0) {
                if (player.x < screenCenterX) {
                    player.x += player.vx;
                } else {
                    worldScrollX += player.vx;
                    distanceMeters += player.vx * 0.08;
                }
            } else if (player.vx < 0) {
                // Hacia la izquierda: puede retroceder en la pantalla
                if (player.x > 80) {
                    player.x += player.vx;
                } else if (worldScrollX > 0) {
                    // O hacer retroceder el mundo si ya avanzó
                    worldScrollX += player.vx;
                    distanceMeters = Math.max(0, distanceMeters + player.vx * 0.08);
                }
            }

            // Salto y gravedad
            player.vy += player.gravity;
            player.y += player.vy;

            // Suelo (se calcula dinámicamente según la pista del primer plano)
            // En primer-plano.png la pista está en los últimos 20% inferiores
            player.groundY = V_HEIGHT - player.height - 40;

            if (player.y >= player.groundY) {
                if (!player.isGrounded) {
                    // Impacto en el suelo
                    createDustParticles(player.x + player.width / 2, player.groundY + player.height - 2, 5);
                }
                player.y = player.groundY;
                player.vy = 0;
                player.isGrounded = true;
            }

            // Animación de rebote (bobbing) al correr
            if (player.isMoving && player.isGrounded) {
                player.runCycle += 0.28;
                player.bobbing = Math.sin(player.runCycle) * 4;

                // Generar partículas de polvo periódicamente
                if (Math.random() < 0.3) {
                    createDustParticles(
                        player.x + (player.facingRight ? 10 : player.width - 10),
                        player.groundY + player.height - 4,
                        1
                    );
                }
            } else if (player.isGrounded) {
                // Respiración sutil en idle
                player.runCycle += 0.04;
                player.bobbing = Math.sin(player.runCycle) * 1.5;
            } else {
                player.bobbing = 0;
            }

            // Actualizar partículas
            for (let i = player.particles.length - 1; i >= 0; i--) {
                const p = player.particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.025;
                p.size *= 0.98;
                if (p.alpha <= 0) {
                    player.particles.splice(i, 1);
                }
            }

            // Actualizar HUD de distancia
            distDisplay.textContent = String(Math.floor(distanceMeters)).padStart(5, '0') + ' m';
        }

        // ==========================================
        // RENDERIZADO CON PARALLAX
        // ==========================================
        function drawParallaxLayer(img, scrollX, speedMultiplier, destHeight, offsetY = 0) {
            if (!img.complete || img.naturalWidth === 0) return;

            const scale = destHeight / img.naturalHeight;
            const drawWidth = img.naturalWidth * scale;

            // Offset cíclico con scroll
            const layerOffset = (scrollX * speedMultiplier) % drawWidth;

            // Dibujar los tiles necesarios para cubrir la pantalla
            let startX = -layerOffset;
            while (startX < V_WIDTH) {
                ctx.drawImage(img, startX, offsetY, drawWidth, destHeight);
                startX += drawWidth;
            }
        }

        function render() {
            // Limpiar canvas
            ctx.fillStyle = '#0f1015';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Escala para mantener el aspect ratio virtual dentro del canvas
            const scaleX = canvas.width / V_WIDTH;
            const scaleY = canvas.height / V_HEIGHT;
            const gameScale = Math.min(scaleX, scaleY);

            const offsetX = (canvas.width - V_WIDTH * gameScale) / 2;
            const offsetY = (canvas.height - V_HEIGHT * gameScale) / 2;

            ctx.save();
            ctx.translate(offsetX, offsetY);
            ctx.scale(gameScale, gameScale);

            // Clip al área de juego virtual
            ctx.beginPath();
            ctx.rect(0, 0, V_WIDTH, V_HEIGHT);
            ctx.clip();

            // 1. CAPA 1: Fondo Lejano (Cielo, montañas y siluetas de Lima)
            // Velocidad lenta para dar profundidad (0.2x)
            drawParallaxLayer(assets.sky, worldScrollX, 0.22, V_HEIGHT, 0);

            // 2. CAPA 2: Primer Plano (Casas residenciales, árboles, vereda y pista)
            // Velocidad completa (1.0x)
            drawParallaxLayer(assets.foreground, worldScrollX, 1.0, V_HEIGHT, 0);

            // 3. PARTÍCULAS DE POLVO DETRÁS DE LAS ZAPATILLAS
            for (const p of player.particles) {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = Math.max(0, p.alpha);
                ctx.fillRect(p.x, p.y, p.size, p.size);
            }
            ctx.globalAlpha = 1.0;

            // 4. PERSONAJE
            if (assets.character.complete && assets.character.naturalWidth > 0) {
                ctx.save();
                
                // Posición con bobbing
                const charX = player.x;
                const charY = player.y + player.bobbing;
                const aspect = charCrop.w / charCrop.h;
                const drawH = player.height;
                const drawW = drawH * aspect;

                if (!player.facingRight) {
                    // Invertir horizontalmente para mirar hacia atrás (izquierda)
                    ctx.translate(charX + drawW, charY);
                    ctx.scale(-1, 1);
                    ctx.drawImage(
                        assets.character,
                        charCrop.x, charCrop.y, charCrop.w, charCrop.h,
                        0, 0, drawW, drawH
                    );
                } else {
                    ctx.drawImage(
                        assets.character,
                        charCrop.x, charCrop.y, charCrop.w, charCrop.h,
                        charX, charY, drawW, drawH
                    );
                }

                // Sombra sutil debajo del personaje en la pista
                const shadowWidth = drawW * 0.7;
                const shadowY = player.groundY + player.height - 4;
                const shadowScale = Math.max(0.3, 1 - (player.groundY - player.y) / 120);
                
                ctx.restore();
                ctx.save();
                ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
                ctx.beginPath();
                ctx.ellipse(
                    charX + drawW / 2,
                    shadowY,
                    (shadowWidth / 2) * shadowScale,
                    6 * shadowScale,
                    0, 0, Math.PI * 2
                );
                ctx.fill();
                ctx.restore();
            }

            // Sombra/Viñeta cinemática retro en bordes
            const grad = ctx.createRadialGradient(
                V_WIDTH / 2, V_HEIGHT / 2, V_WIDTH * 0.35,
                V_WIDTH / 2, V_HEIGHT / 2, V_WIDTH * 0.7
            );
            grad.addColorStop(0, 'rgba(0,0,0,0)');
            grad.addColorStop(1, 'rgba(0,0,0,0.4)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);

            ctx.restore();
        }

        function gameLoop(timestamp) {
            const dt = (timestamp - lastTime) / 1000;
            lastTime = timestamp;

            update(dt);
            render();

            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
